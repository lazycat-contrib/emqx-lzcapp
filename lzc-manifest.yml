application:
  subdomain: emqx
  multi_instance: false
  # EMQX Dashboard has a full account/login system and the default password is
  # overridden via EMQX_DASHBOARD__DEFAULT_PASSWORD (random deploy param), so
  # it qualifies for public_path (papra/servas precedent).
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://emqx:18083/
  ingress:
    # MQTT over TCP (clients connect directly; MQTT has its own auth layer)
    - protocol: tcp
      port: 1883
      service: emqx
    # MQTT over WebSocket
    - protocol: tcp
      port: 8083
      service: emqx
services:
  emqx:
    # upstream: emqx/emqx:6.3.2
    image: docker.1ms.run/emqx/emqx:6.3.2
    environment:
      - EMQX_DASHBOARD__DEFAULT_PASSWORD={{ .U.dashboard_password }}
      # Pin the Erlang node cookie so container rebuilds keep sessions intact
      - EMQX_NODE__COOKIE={{ printf "%x" (stable_secret "emqx_node_cookie") }}
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/opt/emqx/data
      - /lzcapp/var/log:/opt/emqx/log
usage: |
  EMQX 是一个高可用的 MQTT 消息服务器（IoT 物联网消息中间件）：支持
  MQTT 3.1.1 / 5.0、WebSocket、TLS 等协议，带 Dashboard 管理台。

  使用方法：
  1. 打开应用进入 Dashboard 登录页，用户名 admin，密码在部署配置里查看
     （已自动生成随机值，可修改）。
  2. 登录后在「访问控制 - 客户端认证」里按需配置 MQTT 客户端账号。
  3. MQTT 客户端直接连本机 1883 端口（WebSocket 走 8083），这两个端口
     由应用直接对外监听、不经过平台登录页鉴权。

  数据与安全：
  - Dashboard 有独立账号体系且密码已随机化，因此网页入口对外开放
    （public_path）。但 1883 端口默认允许匿名 MQTT 连接，请在 Dashboard
    里尽快开启客户端认证，避免被陌生人读写消息。
  - 数据保存在 /lzcapp/var/data，卸载应用会一并删除，请定期备份。
  - EMQX 5.9 起上游采用 Business Source License（BSL 1.1），自托管
    非商业使用免费，许可正文见 /package-licenses/。

  说明：
  - 本包未做实机验证，功能以官方文档为准，遇到问题请反馈。
